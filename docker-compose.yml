services:
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: supersecretpassword
      POSTGRES_DB: jobtracker
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  api-service:
    build: ./api-service
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:supersecretpassword@db:5432/jobtracker
      - JWT_SECRET_KEY=dev-secret-key-change-in-prod
    depends_on:
      - db

  auth-service:
    build: ./auth-service
    restart: on-failure
    environment:
      - DATABASE_URL=postgresql+psycopg2://postgres:supersecretpassword@db:5432/jobtracker
      - JWT_SECRET_KEY=dev-secret-key-change-in-prod
    depends_on:
      - db

  nginx:
    image: nginx:alpine
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api-service
      - auth-service

volumes:
  pgdata:
