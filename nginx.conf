events {}

http {
    server {
        listen 80;

        # Route API traffic
        location /jobs {
            proxy_pass http://api-service:5000;
        }
        location /jobs/ {
            proxy_pass http://api-service:5000;
        }

        # Route Auth traffic
        location /register {
            proxy_pass http://auth-service:5001;
        }
        location /login {
            proxy_pass http://auth-service:5001;
        }
    }
}
